<!doctype html>
<html lang="zh-CN" data-theme="ink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>儒意 · RU STUDIO — 向历史借灵感，为当代造美物</title>
    <meta name="description" content="儒意 RU STUDIO — 儒家文化创意工作室。致力于构建儒家文化阐释第一品牌。" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%238B1A1A'/><text x='50' y='72' font-size='58' text-anchor='middle' fill='%23E8E4DC' font-family='serif'>儒</text></svg>" />

    <!-- Fonts are self-hosted via @fontsource (see src/main.tsx) -->
    <style>
      /* Critical CSS to prevent FOUC */
      html { background-color: #0A0A0A; }
      body {
        margin: 0;
        background-color: #0A0A0A;
        color: #F5F2EB;
        font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      .fonts-loading body { visibility: hidden; }
    </style>

    <script>
      document.documentElement.classList.add('fonts-loading');
      if (document.fonts) {
        document.fonts.ready.then(function() {
          document.documentElement.classList.remove('fonts-loading');
          document.documentElement.classList.add('fonts-loaded');
        });
        setTimeout(function() {
          document.documentElement.classList.remove('fonts-loading');
        }, 2500);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
